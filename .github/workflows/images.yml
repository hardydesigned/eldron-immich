name: Images (GHCR)

# Zweiter Weg neben dem SSH-Deploy: jeder Push legt fertige Images in die GHCR.
# Der bestehende Deploy bleibt unberührt; Kubernetes zieht später von hier.
# Tags: <commit-sha> (unveränderlich) und prod bzw. staging (beweglich).
on:
  push:
    branches: [staging, main]
  workflow_dispatch:

# Ein älterer Lauf darf den beweglichen Tag nicht nach einem neueren überschreiben.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: immich-server, context: ., file: eldron/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      # Gleiche Upstream-Version wie der SSH-Deploy: steht in der Vorlage der Server-.env.
      - name: Immich-Version
        id: version
        run: echo "immich=$(grep -E '^IMMICH_VERSION=' eldron/env.template | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: |
            IMMICH_VERSION=${{ steps.version.outputs.immich }}
            SOURCE_COMMIT=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.ref_name == 'main' && 'prod' || 'staging' }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
