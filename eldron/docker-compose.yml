# Eine Stufe von ELDRON-Medien. Start über eldron/deploy.sh <prod|staging>, Werte in eldron/.env.
services:
  immich-server:
    image: eldron/immich-server:${ELDRON_STAGE:?}
    build:
      context: ..
      dockerfile: eldron/Dockerfile
      args:
        IMMICH_VERSION: ${IMMICH_VERSION:?}
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?}
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      IMMICH_ADMIN_EMAIL: ${IMMICH_ADMIN_EMAIL:?}
      IMMICH_ADMIN_PASSWORD: ${IMMICH_ADMIN_PASSWORD:?}
      IMMICH_INTERNAL_URL: http://localhost:2283
      PHOTOMOSAIC_TILE_URL: ${PHOTOMOSAIC_TILE_URL:-}
      CONVEX_URL: ${CONVEX_URL:-}
      CONVEX_SERVICE_SECRET: ${CONVEX_SERVICE_SECRET:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      IMMICH_SERVICE_SECRET: ${IMMICH_SERVICE_SECRET:-}
      SC_CONVEX_SITE_URL: ${SC_CONVEX_SITE_URL:-}
      S3_BUCKET: ${HETZNER_BUCKET:?}
      RCLONE_CONFIG_HETZNER_TYPE: s3
      RCLONE_CONFIG_HETZNER_PROVIDER: Other
      RCLONE_CONFIG_HETZNER_ENDPOINT: ${HETZNER_S3_ENDPOINT:?}
      RCLONE_CONFIG_HETZNER_REGION: ${HETZNER_S3_REGION:?}
      RCLONE_CONFIG_HETZNER_ACCESS_KEY_ID: ${HETZNER_S3_ACCESS_KEY:?}
      RCLONE_CONFIG_HETZNER_SECRET_ACCESS_KEY: ${HETZNER_S3_SECRET_KEY:?}
      RCLONE_CONFIG_HETZNER_FORCE_PATH_STYLE: "true"
    volumes:
      - upload:/data
      - sc-data:/sc-data
    depends_on:
      - redis
      - database
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:${HOST_PORT:?}:2283"
    depends_on:
      - immich-server
    restart: unless-stopped

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:?}
    volumes:
      - model-cache:/cache
    restart: unless-stopped

  redis:
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: unless-stopped

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped

volumes:
  upload:
  postgres:
  sc-data:
  model-cache:
